<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1400 900' width='1400' height='900' font-family='Helvetica, Arial, sans-serif'><rect width='1400' height='900' fill='#ffffff'/><defs><marker id='t' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#0f6e6a'/></marker></defs><text x='700.0' y='50.0' font-size='26' fill='#17232b' text-anchor='middle' font-weight='bold' >As seis passagens da eletrostática</text><line x1='633.1' y1='192.8' x2='276.1' y2='645.0' stroke='#0f6e6a' stroke-width='3' marker-end='url(#t)'/><text x='448.3' y='407.9' font-size='19' fill='#17232b' text-anchor='middle' transform='rotate(-51.71 448.3 413.9)'>E = (1/4πε₀) ∫ ρ (r − r′) / |r − r′|³ dτ′</text><line x1='316.9' y1='677.2' x2='673.9' y2='225.0' stroke='#0f6e6a' stroke-width='3' marker-end='url(#t)'/><text x='501.7' y='478.1' font-size='19' fill='#17232b' text-anchor='middle' transform='rotate(-51.71 501.7 456.1)'>∇·E = ρ/ε₀  (e ∇×E = 0)</text><line x1='325.0' y1='746.0' x2='1075.0' y2='746.0' stroke='#0f6e6a' stroke-width='3' marker-end='url(#t)'/><text x='700.0' y='776.0' font-size='19' fill='#17232b' text-anchor='middle' transform='rotate(0.00 700.0 754.0)'>V = −∫ E·dl</text><line x1='1075.0' y1='694.0' x2='325.0' y2='694.0' stroke='#0f6e6a' stroke-width='3' marker-end='url(#t)'/><text x='700.0' y='680.0' font-size='19' fill='#17232b' text-anchor='middle' transform='rotate(0.00 700.0 686.0)'>E = −∇V</text><line x1='726.1' y1='225.0' x2='1083.1' y2='677.2' stroke='#0f6e6a' stroke-width='3' marker-end='url(#t)'/><text x='898.3' y='478.1' font-size='19' fill='#17232b' text-anchor='middle' transform='rotate(51.71 898.3 456.1)'>V = (1/4πε₀) ∫ ρ / |r − r′| dτ′</text><line x1='1123.9' y1='645.0' x2='766.9' y2='192.8' stroke='#0f6e6a' stroke-width='3' marker-end='url(#t)'/><text x='951.7' y='407.9' font-size='19' fill='#17232b' text-anchor='middle' transform='rotate(51.71 951.7 413.9)'>∇²V = −ρ/ε₀  (Poisson)</text><circle cx='700' cy='150' r='62' fill='#ffffff' stroke='#17232b' stroke-width='3'/><text x='700.0' y='170.0' font-size='58' fill='#17232b' text-anchor='middle' font-weight='bold' font-style='italic'>ρ</text><circle cx='250' cy='720' r='62' fill='#ffffff' stroke='#17232b' stroke-width='3'/><text x='250.0' y='740.0' font-size='58' fill='#17232b' text-anchor='middle' font-weight='bold' >E</text><circle cx='1150' cy='720' r='62' fill='#ffffff' stroke='#17232b' stroke-width='3'/><text x='1150.0' y='740.0' font-size='58' fill='#17232b' text-anchor='middle' font-weight='bold' font-style='italic'>V</text><text x='700.0' y='870.0' font-size='18' fill='#5a6a74' text-anchor='middle' font-weight='normal' >Cada lado traz a forma integral num sentido e a forma diferencial no outro.</text></svg>